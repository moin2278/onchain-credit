name: Keep Supabase awake

# Supabase free projects pause after 7 days with no activity. This runs a
# tiny read against the score store every day so the project never pauses.
# Reuses the DATABASE_URL repository secret; no app code involved.

on:
  schedule:
    - cron: "23 11 * * *"   # daily at 11:23 UTC (06:23 America/New_York)
  workflow_dispatch:         # manual "Run workflow" button

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install -q psycopg2-binary
          python - <<'PY'
          import os, sys, psycopg2
          url = os.environ.get("DATABASE_URL", "").strip()
          if not url:
              sys.exit("DATABASE_URL secret is not set.")
          conn = psycopg2.connect(url, connect_timeout=10)
          cur = conn.cursor()
          cur.execute("select count(*) from wallet_scores;")
          print("wallet_scores rows:", cur.fetchone()[0])
          cur.close()
          conn.close()
          print("keep-alive ping ok")
          PY
